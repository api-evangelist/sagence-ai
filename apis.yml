name: Sagence AI
description: >-
  Sagence AI is a semiconductor company building analog in-memory computing
  hardware for AI inference. Its "analog inference machine" combines deep
  subthreshold computing with multi-level flash memory cells to run large AI
  models at a fraction of the power and cost of conventional digital GPUs,
  targeting datacenter and edge workloads such as generative AI, recommendation
  systems, real-time defect detection, and video security. Backed by Khosla
  Ventures, the company positions its technology against offerings like Nvidia's
  B200, claiming large gains in performance-per-watt and cost efficiency for AI
  inference. Sagence AI is a hardware/silicon company and does not currently
  publish a developer API, SDK, or public developer portal.
